services:
  topbox-server:
    # Built by .github/workflows/ci.yml (repo bakardihahahaha/topbox) and pulled from GHCR — the NAS
    # only pulls and runs. Update: Container Manager > Project > topbox > Action > Update.
    image: ghcr.io/bakardihahahaha/topbox-server:latest
    container_name: topbox-server
    restart: unless-stopped
    environment:
      # ============================== FILL IN BEFORE THE FIRST START ==============================
      # The administrator account created on the very first start (empty database). It appears as a
      # tile on the sign-in screen: tap the name, type the PIN.
      #   ADMIN_NAME - name on the tile (and next to the admin's signatures)
      #   ADMIN_PIN  - 4 to 8 digits, in quotes. Leave "" to get a random PIN printed in the log.
      # Only read once: to change the PIN later use Setup > My account in the app (editing it here
      # afterwards has no effect).
      ADMIN_NAME: "Administrator"
      ADMIN_PIN: ""
      # Emergency only (forgotten PIN / locked out): set to "yes", put a new PIN in ADMIN_PIN,
      # restart the container, sign in, then set it back to "no" and restart again.
      ADMIN_RESET: "no"
      # ============================================================================================
      PORT: 8080
      # The whole database — a single SQLite file on the NAS's own disk (bind-mounted ./data), so
      # every read/write is local and fast. Visible in File Station; back it up like any file.
      DB_PATH: /app/data/signoff.db
      # Photos taken during checks (JPEG files) — the "photos" folder inside the same data folder,
      # created automatically: /volume1/docker/topbox/data/photos/<serial number>/…
      PHOTOS_PATH: /app/data/photos
      # Reference photos of the parts (Setup > Parts) — the "part-photos" folder next to it:
      # /volume1/docker/topbox/data/part-photos/<part number>_….jpg
      PART_PHOTOS_PATH: /app/data/part-photos
      # DSM's reverse proxy is the only thing that can reach this container (port published on
      # 127.0.0.1 only), so trusting its X-Forwarded-For is safe — and required for the
      # one-IP-per-account rule and the login rate limit to see real client IPs.
      TRUST_PROXY: "true"
      # Google Sheets backup mirror. Remove both lines to run without a backup (not recommended).
      GOOGLE_SERVICE_ACCOUNT_JSON_PATH: /run/secrets/service-account.json
      # Optional — can also be set (and changed) later in Setup > Backup. Paste just the ID from
      # https://docs.google.com/spreadsheets/d/<SPREADSHEET_ID>/edit
      SPREADSHEET_ID: ""
    ports:
      - "127.0.0.1:8084:8080" # DSM reverse proxy destination: http://127.0.0.1:8084
    volumes:
      - ./data:/app/data
      - ./service-account.json:/run/secrets/service-account.json:ro
