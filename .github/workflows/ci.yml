name: Sign-off

# Tests on every push/PR; publishes ghcr.io/<owner>/signoff-server (what the NAS pulls, see
# docker/docker-compose.yml) from main.

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build --workspace packages/web

  image:
    needs: test
    # Publishes from main (or when started by hand).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/signoff-server:latest
            ghcr.io/${{ github.repository_owner }}/signoff-server:${{ github.sha }}
